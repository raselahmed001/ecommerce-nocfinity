# One command: docker compose up --build
#   Storefront http://localhost:3000   Admin http://localhost:3000/admin/login
#   API        http://127.0.0.1:8000   Mailpit http://127.0.0.1:8025
# Optional Stripe keys go in a file named .env next to this one (see .env.example).

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -psecret --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # inbox in the browser
      - "1025:1025" # SMTP

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      # Demo key only. Create your own with `php artisan key:generate --show` for anything real.
      APP_KEY: "base64:55LQ7qzhEWP3NvpKjduCuAj8Go3hr5y6i+0h+x7BkYk="
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ecommerce
      DB_USERNAME: root
      DB_PASSWORD: secret
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/storage/app/public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      # Pages rendered on the server reach the API by its service name, not 127.0.0.1.
      API_INTERNAL_URL: http://backend:8000/api/v1

volumes:
  dbdata:
  uploads:
